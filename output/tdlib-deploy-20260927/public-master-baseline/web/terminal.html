<div class="glass-panel" style="margin-bottom: 25px;">
    <h3 style="display: flex; align-items: center; gap: 10px;">⚡ Telegram Universal Terminal</h3>
    <p class="subtitle">Ejecuta cualquier método de la Bot API de Telegram directamente sobre tus nodos activos.</p>
    
    <div class="grid-layout" style="grid-template-columns: 1fr 2fr;">
        <div class="glass-panel" style="padding: 15px; background: rgba(0,0,0,0.2);">
            <div class="form-group">
                <label>NODO EMISOR</label>
                <select id="termBotIdx" class="input-style-mini" style="height: 40px;"></select>
            </div>
            <div class="form-group">
                <label>MÉTODO API</label>
                <input type="text" id="termMethod" placeholder="ej: sendMessage, getChat..." list="commonMethods">
                <datalist id="commonMethods">
                    <option value="getMe">
                    <option value="getUpdates">
                    <option value="sendMessage">
                    <option value="sendMessageDraft">
                    <option value="sendPhoto">
                    <option value="getChat">
                    <option value="getChatAdministrators">
                    <option value="deleteMessage">
                    <option value="banChatMember">
                    <option value="unbanChatMember">
                    <option value="getManagedBotToken">
                    <option value="replaceManagedBotToken">
                    <option value="setMyProfilePhoto">
                    <option value="removeMyProfilePhoto">
                </datalist>
            </div>
            <button onclick="runTelegramCommand()" class="btn-glow-mini" style="width: 100%; margin-top: 20px;">EJECUTAR PETICIÓN</button>
        </div>

        <div class="glass-panel" style="padding: 15px; display: flex; flex-direction: column;">
            <label style="font-size: 10px; color: var(--primary); font-weight: 800; margin-bottom: 10px;">PARÁMETROS (JSON)</label>
            <textarea id="termParams" placeholder='{ "chat_id": "-100...", "text": "Hola" }' style="flex-grow: 1; font-family: 'JetBrains Mono'; font-size: 12px; background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.05);"></textarea>
        </div>
    </div>

    <div class="glass-panel mt-20" style="background: #000; border: 1px solid #1e293b;">
        <label style="font-size: 10px; color: var(--accent); font-weight: 800; margin-bottom: 10px;">RESPUESTA DEL SERVIDOR</label>
        <pre id="termResponse" style="max-height: 300px; overflow-y: auto; font-family: 'JetBrains Mono'; font-size: 12px; color: #4ade80; margin: 0; padding: 10px;">Esperando comandos...</pre>
    </div>
</div>

<script>
    // Poblar lista de bots
    fetch('/api/bots', { headers: { 'Authorization': localStorage.getItem('moon_token') } })
    .then(r => r.json()).then(data => {
        const select = document.getElementById("termBotIdx");
        if(select && data.bots) {
            select.innerHTML = data.bots.map((b, i) => `<option value="${i}">Nodo ${i+1}: @${b.name}</option>`).join("");
        }
    });

    function runTelegramCommand() {
        const method = document.getElementById("termMethod").value;
        const paramsStr = document.getElementById("termParams").value || "{}";
        const idx = document.getElementById("termBotIdx").value;
        const out = document.getElementById("termResponse");

        try {
            const params = JSON.parse(paramsStr);
            out.innerText = "> Enviando petición a Telegram...";
            
            fetch('/api/telegram/call', {
                method: 'POST',
                headers: { 
                    'Authorization': localStorage.getItem('moon_token'),
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ method, params, bot_idx: parseInt(idx) })
            })
            .then(r => r.json()).then(data => {
                out.innerText = JSON.stringify(data, null, 4);
            }).catch(e => {
                out.innerText = "❌ Error de conexión: " + e.message;
            });
        } catch(e) {
            alert("JSON Inválido: " + e.message);
        }
    }
</script>

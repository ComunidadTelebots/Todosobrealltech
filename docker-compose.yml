services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped
    depends_on:
      - api
      - pocketbase
    ports:
      - "8080:80"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: .
      dockerfile: apps/pocketbase/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pocketbase_data:/data
    ports:
      - "8090:8090"

volumes:
  pocketbase_data:

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
        VITE_ADSENSE_ID: ${VITE_ADSENSE_ID:-}
    restart: unless-stopped
    depends_on:
      - api
      - pocketbase
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.todosobrealltech.rule=Host(`${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.todosobrealltech.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.todosobrealltech.tls=true"
      - "traefik.http.routers.todosobrealltech.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.todosobrealltech.middlewares=ol-todosobreall@file,telegram-login-coop"
      - "traefik.http.middlewares.telegram-login-coop.headers.customresponseheaders.Cross-Origin-Opener-Policy=same-origin-allow-popups"
      - "traefik.http.services.todosobrealltech.loadbalancer.server.port=80"
      - "traefik.http.services.todosobrealltech.loadbalancer.passHostHeader=true"

  noticiasweb3:
    build:
      context: .
      dockerfile: apps/noticiasweb3/Dockerfile
      args:
        VITE_ADSENSE_ID: ${VITE_ADSENSE_ID:-}
        VITE_ADSENSE_SLOT_TOP: ${VITE_ADSENSE_SLOT_TOP:-}
        VITE_ADSENSE_SLOT_RIGHT: ${VITE_ADSENSE_SLOT_RIGHT:-}
        VITE_ADSENSE_SLOT_INLINE: ${VITE_ADSENSE_SLOT_INLINE:-}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
        VITE_API_URL: https://api.${WEB_HOST:-todosobreall.tech}
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.noticiasweb3.rule=Host(`noticiasweb3.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.noticiasweb3.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.noticiasweb3.tls=true"
      - "traefik.http.routers.noticiasweb3.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.noticiasweb3.middlewares=ol-noticiasweb3@file"
      - "traefik.http.routers.noticiasweb3-duckdns.rule=Host(`noticiasweb3.duckdns.org`)"
      - "traefik.http.routers.noticiasweb3-duckdns.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.noticiasweb3-duckdns.tls=true"
      - "traefik.http.routers.noticiasweb3-duckdns.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.noticiasweb3-duckdns.service=noticiasweb3"
      - "traefik.http.services.noticiasweb3.loadbalancer.server.port=80"
      - "traefik.http.services.noticiasweb3.loadbalancer.passHostHeader=true"

  resistencia-censura:
    build:
      context: .
      dockerfile: apps/resistencia-censura/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.resistencia-censura.rule=Host(`resistenciaalacensura.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.resistencia-censura.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.resistencia-censura.tls=true"
      - "traefik.http.routers.resistencia-censura.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.resistencia-censura.middlewares=ol-resistenciaalacensura@file"
      - "traefik.http.services.resistencia-censura.loadbalancer.server.port=80"
      - "traefik.http.services.resistencia-censura.loadbalancer.passHostHeader=true"

  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_ASSETS_URL: ${VITE_ASSETS_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.proxy.rule=Host(`proxy.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.proxy.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.proxy.tls=true"
      - "traefik.http.routers.proxy.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.proxy.loadbalancer.server.port=80"
      - "traefik.http.services.proxy.loadbalancer.passHostHeader=true"

  comunidadtelebots:
    build:
      context: .
      dockerfile: apps/comunidadtelebots/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.comunidadtelebots.rule=Host(`comunidadtelebots.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.comunidadtelebots.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.comunidadtelebots.tls=true"
      - "traefik.http.routers.comunidadtelebots.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.comunidadtelebots.middlewares=ol-comunidadtelebots@file"
      - "traefik.http.services.comunidadtelebots.loadbalancer.server.port=80"
      - "traefik.http.services.comunidadtelebots.loadbalancer.passHostHeader=true"

  todosobregameplays:
    build:
      context: .
      dockerfile: apps/todosobregameplays/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.todosobregameplays.rule=Host(`todosobregameplays.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.todosobregameplays.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.todosobregameplays.tls=true"
      - "traefik.http.routers.todosobregameplays.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.todosobregameplays.middlewares=ol-todosobregameplays@file"
      - "traefik.http.services.todosobregameplays.loadbalancer.server.port=80"
      - "traefik.http.services.todosobregameplays.loadbalancer.passHostHeader=true"

  gamergitbug:
    build:
      context: .
      dockerfile: apps/gamergitbug/Dockerfile
      args:
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.gamergitbug.rule=Host(`gamergitbug.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.gamergitbug.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.gamergitbug.tls=true"
      - "traefik.http.routers.gamergitbug.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.gamergitbug.middlewares=ol-gamergitbug@file"
      - "traefik.http.routers.gamergitbug-duckdns.rule=Host(`gamergitbug.duckdns.org`)"
      - "traefik.http.routers.gamergitbug-duckdns.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.gamergitbug-duckdns.tls=true"
      - "traefik.http.routers.gamergitbug-duckdns.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.gamergitbug-duckdns.service=gamergitbug"
      - "traefik.http.services.gamergitbug.loadbalancer.server.port=80"
      - "traefik.http.services.gamergitbug.loadbalancer.passHostHeader=true"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - pocketbase
    volumes:
      - proxy_history:/data
    networks:
      - default
      - traefik
      - mtproto
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.api.rule=Host(`api.${WEB_HOST:-todosobreall.tech}`)"
      - "traefik.http.routers.api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROXY_CRAWLER=1
      # El crawl de proxies hace miles de resoluciones DNS + TCP-checks. Con los 4
      # hilos por defecto de libuv, getaddrinfo se satura y ahoga al resto de jobs
      # (RSS, telegramSync, PocketBase) con timeouts falsos. Ver commit df163c3.
      - UV_THREADPOOL_SIZE=64
      # 64 conexiones TCP simultaneas sostenidas durante todo el crawl dejaban
      # sin turno a los connects de RSS/PocketBase (UND_ERR_CONNECT_TIMEOUT en
      # ~20% de los fetch externos del worker). No era conntrack: la tabla no
      # pasa del 38%. Ver diagnostico en la sesion del 2026-07-19.
      - MTPROTO_HEALTH_CONCURRENCY=16
      - RSS_MAX_NEW_PER_RUN=${RSS_MAX_NEW_PER_RUN:-25}
    volumes:
      - proxy_history:/data
    depends_on:
      - pocketbase
    networks:
      - default
      - mtproto

  pocketbase:
    build:
      context: .
      dockerfile: apps/pocketbase/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pocketbase_data:/data
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.pocketbase.rule=Host(`${WEB_HOST:-todosobreall.tech}`) && PathPrefix(`/hcgi/platform`)"
      - "traefik.http.routers.pocketbase.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.pocketbase.tls=true"
      - "traefik.http.routers.pocketbase.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.pocketbase.middlewares=pocketbase-stripprefix"
      - "traefik.http.middlewares.pocketbase-stripprefix.stripprefix.prefixes=/hcgi/platform"
      - "traefik.http.services.pocketbase.loadbalancer.server.port=8090"

volumes:
  pocketbase_data:
  proxy_history:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
  mtproto:
    external: true
    name: mtproto-proxy_default

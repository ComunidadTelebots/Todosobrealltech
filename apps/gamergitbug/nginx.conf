limit_req_zone $binary_remote_addr zone=contact_login:1m rate=5r/m;
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 32k;

    # Only existing authenticated APIs are exposed. No bot tokens in the browser.
    location = /contact-api/login {
        limit_except POST { deny all; }
        limit_req zone=contact_login burst=5 nodelay;
        limit_req_status 429;
        set $contact_auth http://todosobrealltech-pocketbase:8090;
        proxy_pass $contact_auth/api/collections/users/auth-with-password;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }
    location = /contact-api/access {
        limit_except GET { deny all; }
        set $contact_api http://todosobrealltech-api:3001;
        proxy_pass $contact_api/moonbot-admin/development-access;
        proxy_set_header Cookie "";
        add_header Cache-Control "no-store" always;
    }
    location = /contact-api/conversations {
        limit_except GET POST { deny all; }
        set $contact_api http://todosobrealltech-api:3001;
        proxy_pass $contact_api/moonbot-admin/bot-conversations$is_args$args;
        proxy_set_header Cookie "";
        proxy_read_timeout 32s;
        # Reply requests must never be retried after an ambiguous upstream failure.
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }
    location /contact-api/ { return 404; }
    location /contacto-admin {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

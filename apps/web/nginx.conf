server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Docker cambia la IP de los servicios al recrear contenedores. Resolverlos
    # dinámicamente evita que Nginx conserve una dirección antigua hasta que se
    # reinicie manualmente el contenedor web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    location /hcgi/api/ {
        set $api_upstream http://todosobrealltech-api:3001;
        rewrite ^/hcgi/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"ok":false,"error":"Servicio API temporalmente no disponible"}';
    }
    location ~ ^/(future-features-1000|telegram-react-roadmap)\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location /hcgi/platform/ {
        set $pocketbase_upstream http://todosobrealltech-pocketbase:8090;
        rewrite ^/hcgi/platform/(.*)$ /$1 break;
        proxy_pass $pocketbase_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://noticiasweb3.todosobreall.tech" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

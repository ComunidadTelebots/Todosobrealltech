server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    location /hcgi/api/ {
        proxy_pass http://todosobrealltech-api:3001/;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"ok":false,"error":"Servicio API temporalmente no disponible"}';
    }
    location /hcgi/platform/ {
        proxy_pass http://todosobrealltech-pocketbase:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://noticiasweb3.todosobreall.tech" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Flag requests coming from Telegram's link-preview crawler.
map $http_user_agent $is_telegram_bot {
    default         0;
    "~*TelegramBot" 1;
}

map $http_x_forwarded_proto $tsa_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — required because the preview proxy_pass below
    # uses a variable, which forces nginx to resolve "api" at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Catálogo de campañas propias y medición de clics. Sin este proxy, la SPA
    # respondía index.html a /hcgi/api/house-ads y el componente no recibía JSON.
    location /hcgi/api/ {
        set $api_upstream http://todosobrealltech-api:3001;
        rewrite ^/hcgi/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tsa_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"Servicio API temporalmente no disponible"}';
    }

    # Article pages: serve the clean server-rendered OG preview to TelegramBot,
    # and the normal React SPA (index.html) to every other client.
    location ~ ^/noticias/(?<slug>.+)$ {
        # Only take effect when the request is proxied below.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tsa_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        if ($is_telegram_bot) {
            proxy_pass http://todosobrealltech-api:3001/preview/$slug;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

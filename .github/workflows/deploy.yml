name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy noticiasweb3
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_CONFIGURED: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}

    steps:
      - name: Deployment configuration status
        run: |
          if [ "$VPS_CONFIGURED" != "true" ]; then
            echo "Deployment skipped: configure VPS_HOST, VPS_USER and VPS_SSH_KEY in GitHub Actions secrets."
          fi
      - name: SSH deploy
        if: env.VPS_CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker network create traefik 2>/dev/null || true
            cd /root/Todosobrealltech
            git pull --ff-only origin main
            docker compose up -d --build --no-deps noticiasweb3
            docker image prune -f

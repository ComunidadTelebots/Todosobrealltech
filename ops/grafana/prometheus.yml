global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: vps
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: grafana
    metrics_path: /observabilidad/metrics
    static_configs:
      - targets: [grafana:3000]
  - job_name: servicios-observabilidad
    static_configs:
      - targets: [prometheus:9090, loki:3100, alertmanager:9093]
rule_files:
  - /etc/prometheus/alerts.yml
